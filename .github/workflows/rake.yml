name: rake

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:

# One live run per workflow+event+ref: a superseded push to the
# same PR/branch cancels its predecessors instead of queueing
# behind them (the runner queue otherwise stacks generations).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Run fast tests (unit + adapter + integration)
        run: bundle exec rake spec:fast

      - name: Run rubocop
        run: bundle exec rubocop

      - name: Run performance gates (YJIT)
        env:
          RUN_PERFORMANCE: "1"
          RUBY_YJIT_ENABLE: "1"
        run: bundle exec rake spec:performance

      - name: Plan parity lock (plan vs raw-nokogiri CPU)
        env:
          LEPTRIS_BENCH_LOCK: "1"
        run: bundle exec rake benchmark:plan

  # Order-flake tripwire (TODO.model/06 checker integrity): the same
  # example order every run - a red here reproduces locally with
  # `rspec --bisect --order rand:424242`. The per-PR matrix legs keep
  # their random seeds for breadth; this one is the deterministic twin.
  battery-fixed-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Full battery at the fixed seed
        run: bundle exec rspec --order rand:424242
