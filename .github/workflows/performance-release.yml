name: performance-release

# Every release re-measures the scoreboard and appends the table to
# the release notes (TODO.sota/04). Triggered by the release
# workflow's completion; idempotent — a re-run replaces the marked
# section instead of stacking it.
on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Pinned: runner-image drift (ubuntu-latest -> 26) and vCPU count
        # move the walk-row ratios; the lock compares like against like.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Pin to the exact tree the release run published, so the
          # measured scoreboard describes the released code even when
          # main moves between the release and this report.
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          submodules: "recursive"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install ragel
        run: sudo apt-get update && sudo apt-get install -y ragel

      - name: Install ruby-ll (for rake vendor:prepare)
        run: gem install ruby-ll --no-document

      - name: Generate ragel / ruby-ll outputs in vendored forks
        run: rake vendor:prepare

      - name: Install dependencies
        run: bundle install

      - name: Compile liboga / libll native extensions
        run: rake vendor:compile

      - name: Let the runner settle after the build
        run: |
          # The compile steps above push the 1-minute load past the
          # scoreboard's gate budget (half the vCPUs) right before the
          # measurement; wait (bounded) for the runner's own build
          # burst to decay so the gate judges steady-state load.
          for i in $(seq 1 60); do
            load=$(awk '{print $1}' /proc/loadavg)
            ncpu=$(nproc)
            awk -v l="$load" -v n="$ncpu" 'BEGIN { exit !(l <= n * 0.5) }' && break
            sleep 5
          done
          echo "1-minute load at measure time: $(awk '{print $1}' /proc/loadavg)"

      - name: Measure the scoreboard
        run: |
          SCORE_MARKDOWN=/tmp/section.md \
            bundle exec ruby benchmark/scoreboard.rb

      - name: Append the scoreboard to the release notes of the measured version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes target is the release created by the triggering
          # run — NOT "latest" (a rerun of an old run would mis-aim)
          # and NOT the gemspec at the pinned tree (the checkout is
          # the pre-bump tree; the bump lands on main during the
          # release run itself).
          TRIGGERED_AT="${{ github.event.workflow_run.created_at }}"
          TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq "map(select(.created_at >= \"${TRIGGERED_AT}\")) | sort_by(.created_at) | last | .tag_name")
          TAG=${TAG:-$(gh release view --json tagName --jq .tagName)}
          echo "Reporting against $TAG"
          gh release view "$TAG" --json body --jq .body > /tmp/body.md
          ruby -e '
            body = File.read("/tmp/body.md")
            section = File.read("/tmp/section.md")
            block = "<!-- PERFORMANCE:BEGIN -->\n#{section}" \
                    "<!-- PERFORMANCE:END -->"
            if body.include?("<!-- PERFORMANCE:BEGIN -->")
              body = body.sub(
                /<!-- PERFORMANCE:BEGIN -->.*<!-- PERFORMANCE:END -->/m,
                block,
              )
            else
              body = body.chomp + "\n\n" + block
            end
            File.write("/tmp/new_body.md", body)
          '
          gh release edit "$TAG" --notes-file /tmp/new_body.md
