name: round-trip

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # Fast: Ruby versions with full-support adapters (Nokogiri + Oga).
  # These adapters provide complete XML conformance for production use.
  ruby-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.1", "3.2", "3.3", "3.4", "4.0" ]
        category: [ metanorma, rfcxml, niso-jats ]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # bundler-cache is disabled because the path-source oga
          # and ruby-ll forks need ragel + ruby-ll outputs generated
          # (rake vendor:prepare) before their C extensions can compile.
          bundler-cache: false

      - name: Install ragel
        run: sudo apt-get update && sudo apt-get install -y ragel

      - name: Install ruby-ll (for rake vendor:prepare)
        run: gem install ruby-ll --no-document

      - name: Generate ragel / ruby-ll outputs in vendored forks
        run: rake vendor:prepare

      - name: Install dependencies
        run: bundle install

      - name: Compile liboga / libll native extensions
        run: rake vendor:compile

      - name: Run round-trip tests (${{ matrix.category }})
        run: bundle exec rspec spec/consistency/ --tag round_trip --tag fixture_category:${{ matrix.category }}
        env:
          MOXML_ROUNDTRIP_TIMEOUT: 120
          MOXML_ROUNDTRIP_ADAPTERS: nokogiri,oga

  # Experimental: Ox adapter with Nokogiri (Ox lacks full XPath/namespace support).
  nokogiri-ox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.3", "4.0" ]
        category: [ metanorma, rfcxml, niso-jats ]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Install ragel
        run: sudo apt-get update && sudo apt-get install -y ragel

      - name: Install ruby-ll (for rake vendor:prepare)
        run: gem install ruby-ll --no-document

      - name: Generate ragel / ruby-ll outputs in vendored forks
        run: rake vendor:prepare

      - name: Install dependencies
        run: bundle install

      - name: Compile liboga / libll native extensions
        run: rake vendor:compile

      - name: Run Nokogiri × Ox round-trip tests (${{ matrix.category }})
        run: bundle exec rspec spec/consistency/ --tag round_trip --tag fixture_category:${{ matrix.category }}
        env:
          MOXML_ROUNDTRIP_TIMEOUT: 300
          MOXML_ROUNDTRIP_ADAPTERS: nokogiri,ox

  # Experimental: REXML adapter with Nokogiri (REXML is pure Ruby, exponentially slow).
  # Skips fixtures over 50KB due to O(n²) complexity.
  nokogiri-rexml:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.3", "4.0" ]
        category: [ metanorma, rfcxml, niso-jats ]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Install ragel
        run: sudo apt-get update && sudo apt-get install -y ragel

      - name: Install ruby-ll (for rake vendor:prepare)
        run: gem install ruby-ll --no-document

      - name: Generate ragel / ruby-ll outputs in vendored forks
        run: rake vendor:prepare

      - name: Install dependencies
        run: bundle install

      - name: Compile liboga / libll native extensions
        run: rake vendor:compile

      - name: Run Nokogiri × REXML round-trip tests (${{ matrix.category }})
        run: bundle exec rspec spec/consistency/ --tag round_trip --tag fixture_category:${{ matrix.category }}
        env:
          MOXML_ROUNDTRIP_TIMEOUT: 300
          MOXML_ROUNDTRIP_ADAPTERS: nokogiri,rexml
          MOXML_ROUNDTRIP_REXML_MAX_SIZE: 50000
