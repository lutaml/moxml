name: performance

# The published scoreboard lock (TODO.sota/04). Runs on a quiet
# weekly schedule (and on demand); PRs do not run it — measurement
# noise is a release concern, not a change-gating one.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lock:
    # Pinned: runner-image drift (ubuntu-latest -> 26) and vCPU count
        # move the walk-row ratios; the lock compares like against like.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Let the runner settle after the build
        run: |
          # The compile steps above push the 1-minute load past the
          # scoreboard's gate budget (half the vCPUs) right before the
          # measurement; wait (bounded) for the runner's own build
          # burst to decay so the gate judges steady-state load.
          for i in $(seq 1 60); do
            load=$(awk '{print $1}' /proc/loadavg)
            ncpu=$(nproc)
            awk -v l="$load" -v n="$ncpu" 'BEGIN { exit !(l <= n * 0.5) }' && break
            sleep 5
          done
          echo "1-minute load at measure time: $(awk '{print $1}' /proc/loadavg)"

      - name: Scoreboard lock (parity rows + 10% regression tolerance)
        run: bundle exec rake benchmark:lock

      - name: Upload the measured scoreboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard
          # The measured JSON, not the committed baseline: a failed
          # lock must upload the measurement that failed it.
          path: /tmp/measured-scoreboard.json
          if-no-files-found: ignore
