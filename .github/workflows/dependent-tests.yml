name: dependent-gems-test

on:
  push:
    branches: [ main ]
    tags: [ v* ]
    paths-ignore:
      - '**.adoc'
  pull_request:
    paths-ignore:
      - '**.adoc'
  workflow_dispatch:
  repository_dispatch:
    types: [ release-passed ]

# One live run per workflow+event+ref: a superseded push to the
# same PR/branch cancels its predecessors instead of queueing
# behind them (the runner queue otherwise stacks generations).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/dependent-rake.yml@main
    with:
      command: bundle exec rspec