name: moxml-testsuite

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.adoc'
  pull_request:
    paths-ignore:
      - '**.adoc'
  workflow_dispatch:

# The data gate runs against THIS checkout: lutaml/moxml-testsuite is
# the data-definition repository — the canonical home of the
# conformance dataset. Its identity gate regenerates the dataset from
# THIS checkout's case tables (rake conformance:export) and fails when
# the committed copy drifts — a model answer change that stales the
# dataset goes red here, the same early warning the moxml-rs/moxml-ts
# vendored pins provide.

jobs:
  testsuite:
    runs-on: ubuntu-latest
    name: dataset gates (structure + identity)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: lutaml/moxml-testsuite
          path: testsuite
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Bundle THIS checkout (the identity gate runs the export here)
        run: bundle install --jobs 4
      - name: Structure gate (gem-free)
        working-directory: testsuite
        run: ruby tools/validate_schema.rb
      - name: Tool-guard specs
        working-directory: testsuite
        run: |
          bundle install
          bundle exec rspec
      - name: Identity gate (this checkout is the reference)
        working-directory: testsuite
        env:
          MOXML_PATH: ${{ github.workspace }}
        run: ruby tools/validate.rb
